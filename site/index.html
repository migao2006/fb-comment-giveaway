<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f0e8">
    <meta name="description" content="在 Facebook 貼文頁載入主留言、下載 CSV 並抽獎。">
    <meta property="og:title" content="FB 留言抽獎">
    <meta property="og:description" content="iPhone Safari 書籤工具，只讀取主留言。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://migao2006.github.io/fb-comment-giveaway/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="FB 留言抽獎">
    <meta name="twitter:description" content="載入主留言、下載 CSV、抽獎。">
    <title>FB 留言抽獎</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top">FB 留言抽獎</a>
      <a href="https://github.com/migao2006/fb-comment-giveaway">GitHub</a>
    </header>

    <main id="top">
      <section class="intro">
        <p class="tag">iPhone Safari 書籤工具</p>
        <h1>FB 留言抽獎</h1>
        <p>載入主留言、下載 CSV、抽獎。</p>
        <button id="copy-bookmarklet" class="primary-button" type="button">
          <span>複製書籤程式</span>
          <span class="button-state" aria-live="polite"></span>
        </button>
        <noscript>請啟用 JavaScript。</noscript>
      </section>

      <section class="guide" aria-labelledby="install-title">
        <h2 id="install-title">安裝</h2>
        <ol>
          <li><b>1</b><span>在 Safari 將本頁加入書籤。</span></li>
          <li><b>2</b><span>複製上方程式，貼到該書籤的網址欄。</span></li>
          <li><b>3</b><span>開啟 Facebook 貼文，把排序改成「所有留言」，再執行書籤。</span></li>
        </ol>
      </section>

      <p class="note">只處理目前頁面可見的主留言；資料不會上傳。</p>
    </main>

    <footer>
      <span>非 Facebook 官方工具</span>
      <a href="./bookmarklet.txt" download>下載文字版</a>
    </footer>

    <script src="./assets/install.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
